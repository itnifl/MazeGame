name: Build & Test

on:
  push:
  pull_request:

jobs:
  tycho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build Eclipse plug-ins + p2
        run: mvn -B -U -e -DskipTests=false clean verify
      - name: Upload p2 site
        uses: actions/upload-artifact@v4
        with:
          name: maze-p2-repository
          path: maze-repository/target/repository/**

  game:
    runs-on: ubuntu-latest
    needs: tycho
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build generated code + game
        run: |
          mvn -B -U -e -pl maze-generated,maze -am \
            -Djavafx.platform=linux \
            -DskipTests=false clean verify
      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: maze-game
          path: "maze/target/**/*.jar"