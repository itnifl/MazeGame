name: Build & Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  tycho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache local p2 mirror
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: releng/local-p2
          key: p2-${{ runner.os }}-${{ hashFiles('releng/mirror/pom.xml','releng/maze.target') }}

      - name: Build Eclipse plug-ins + p2 site (Tycho only)
        run: |
          mvn -B -U -e \
            -pl releng/mirror,main.game.maze.walls,main.game.maze.mazeworld,main.game.maze.behaviour,main.game.maze.difficulties,main.game.maze.opponents,maze-generator.freemarker,main.game.maze.dsl,main.game.maze.dsl.ide,main.game.maze.dsl.ui,main.game.maze.dsl.tests,maze-feature,maze-module-repository,maze-generator.freemarker-runner,maze-module-generator,maze-javafx \
            -am \
            -DskipTests=true \
            clean install

      - name: Upload p2 site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maze-p2-repository
          path: maze-module-repository/target/repository/**

      - name: Upload local Maven artifacts (eclipse-plugin JARs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maze-maven-artifacts
          path: ~/.m2/repository/main/game/maze/
          retention-days: 1

  game:
    runs-on: ubuntu-latest
    needs: tycho
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Restore local p2 mirror
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: releng/local-p2
          key: p2-${{ runner.os }}-${{ hashFiles('releng/mirror/pom.xml','releng/maze.target') }}
          restore-keys: |
            p2-${{ runner.os }}-

      - name: Download eclipse-plugin JARs from tycho job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maze-maven-artifacts
          path: ~/.m2/repository/main/game/maze/

      - name: Install Xvfb (headless JavaFX)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Test common backend and frontend modules
        run: |
          mvn -B -e \
            -DskipITs \
            -pl maze-common-backend,maze-common-frontend \
            verify

      - name: Test libGDX module
        run: |
          mvn -B -e \
            -DskipITs \
            -pl maze-libgdx -am \
            verify

      - name: Test JavaFX modules (headless)
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          mvn -B -e \
            -DskipITs \
            -Djavafx.platform=linux \
            -pl maze-javafx-backend -am \
            verify
