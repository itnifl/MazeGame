name: Build & Test

on:
  push:
  pull_request:

jobs:
  tycho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      # optional: cache local p2 mirror if you use releng/mirror
      - name: Cache local p2 mirror
        uses: actions/cache@v4
        with:
          path: releng/local-p2
          key: p2-${{ runner.os }}-${{ hashFiles('releng/mirror/pom.xml','releng/maze.target') }}

      - name: Build Eclipse plug-ins + p2 site (Tycho)
        run: mvn -B -U -e -DskipTests=false clean verify

      - name: Upload p2 site
        uses: actions/upload-artifact@v4
        with:
          name: maze-p2-repository
          path: maze-repository/target/repository/**

  game:
    runs-on: ubuntu-latest
    needs: tycho
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      - name: Ensure generated source folder exists
        run: mkdir -p maze-generated/src/main/java

      # run the generator so maze-generated has sources
      - name: Run Acceleo generator
        run: |
          mvn -B -U -e \
            -pl maze-generator.acceleo -am \
            -Dtycho.localArtifacts=ignore \
            -DskipTests clean verify

      - name: Install Xvfb (headless JavaFX)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build generated code + game (with tests)
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          mvn -B -U -e \
            -pl maze -am \
            -Djavafx.platform=linux \
            -Dtycho.localArtifacts=ignore \
            -DskipTests=false clean verify

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: maze-game
          path: |
            maze/target/**/*.jar
            maze-generated/target/**/*.jar
