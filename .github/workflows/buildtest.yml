name: Build & Test

on:
  pull_request:

jobs:
  tycho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      - name: Cache local p2 mirror
        uses: actions/cache@v4
        with:
          path: releng/local-p2
          key: p2-${{ runner.os }}-${{ hashFiles('releng/mirror/pom.xml','releng/maze.target') }}

      - name: Build Eclipse plug-ins + p2 site (Tycho only)
        run: |
          mvn -B -U -e \
            -pl releng/mirror,maze-feature,maze-module-repository \
            -am \
            -DskipTests=true \
            clean verify

      - name: Upload p2 site
        uses: actions/upload-artifact@v4
        with:
          name: maze-p2-repository
          path: maze-module-repository/target/repository/**
          
  game:
    runs-on: ubuntu-latest
    needs: tycho
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      # 🔹 NYTT: hent opp lokalt p2-mirror bygget i 'tycho'-jobben
      - name: Restore local p2 mirror
        uses: actions/cache@v4
        with:
          path: releng/local-p2
          key: p2-${{ runner.os }}-${{ hashFiles('releng/mirror/pom.xml','releng/maze.target') }}
          restore-keys: |
            p2-${{ runner.os }}-

      - name: Install Xvfb (headless JavaFX)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build game (with tests)
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          mvn -B -U -e \
            -pl maze -am \
            -Djavafx.platform=linux \
            -DskipTests=false \
            clean verify

