name: Build & Test (JavaFX only)

on:
  workflow_dispatch:
  push:
    paths:
      - "maze/**"
      - "maze-generated/**"
      - ".github/workflows/**"
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven

      - name: Ensure generated sources exist
        run: mkdir -p maze-generated/src/main/java

      - name: Run Acceleo generator
        run: mvn -B -U -e -pl maze-generator.acceleo -am -DskipTests clean verify

      - name: Install Xvfb (headless JavaFX)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build game with tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          mvn -B -U -e -pl maze -am -Djavafx.platform=linux -DskipTests=false clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"

      - name: Upload game artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maze-game
          path: maze/target/**/*.jar