name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and run all tests
        run: |
          mvn -B -U -e \
            -Djavafx.platform=linux \
            -Dtestfx.robot=glass \
            -Dtestfx.headless=true \
            -Dprism.order=sw \
            -Dprism.text=t2k \
            -Dheadless=true \
            -DskipTests=false \
            clean verify

      - name: Upload surefire test reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"

      - name: Upload failsafe (integration) test reports if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: "**/target/failsafe-reports/**"
          if-no-files-found: ignore
