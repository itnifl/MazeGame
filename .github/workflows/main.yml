name: Build & Test (JavaFX only)

on:  
  pull_request:
    paths:
      - "maze-javafx/**"
      - "maze-javafx-backend/**"
      - "maze-common-backend/**"
      - "maze-common-frontend/**"
      - ".github/workflows/**"

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Xvfb (headless JavaFX)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          
      - name: Build Eclipse plug-ins + p2 site (Tycho only)
        run: |
          mvn -B -U -e \
            -pl releng/mirror,main.game.maze.walls,main.game.maze.mazeworld,main.game.maze.behaviour,main.game.maze.difficulties,main.game.maze.opponents,maze-generator.freemarker,main.game.maze.dsl,main.game.maze.dsl.ide,main.game.maze.dsl.ui,main.game.maze.dsl.tests,maze-feature,maze-module-repository,maze-generator.freemarker-runner,maze-module-generator,maze-javafx \
            -am \
            -DskipTests=true \
            clean install

      - name: Test common backend and frontend modules
        run: |
          mvn -B -e \
            -DskipITs \
            -pl maze-common-backend,maze-common-frontend \
            test

      - name: Test libGDX module
        run: |
          mvn -B -e \
            -DskipITs \
            -pl maze-libgdx -am \
            test

      - name: Test JavaFX modules (headless)
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          mvn -B -e \
            -DskipITs \
            -Djavafx.platform=linux \
            -pl maze-javafx-backend -am \
            test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"

      - name: Upload game artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maze-game
          path: maze-javafx-backend/target/**/*.jar